trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: Usar Python 3.11

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: Usar Python 3.11

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r Servidor/requirements.txt pytest
    displayName: Instalar dependencias

  - script: python -m pytest Servidor/pruebas/prueba_auth.py -v
    displayName: Pruebas de autenticación

  - script: docker build -f Servidor/Dockerfile -t battle-arena-servidor:$(Build.BuildId) .
    displayName: Construir imagen Docker