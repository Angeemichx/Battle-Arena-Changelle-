services:
  servidor:
    build:
      context: .
      dockerfile: Servidor/Dockerfile
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/usuarios.json
      HISTORIAL_FILE: /app/data/historial.json
    volumes:
      - ./Servidor/infraestructure/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Servidor/Dockerfile
    command: ["python",  "app_movil.py"]
    ports:
      - "8080:8080"
    volumes:
      - ./app_movil.py:/app/app_movil.py:ro
      - ./Servidor/infraestructure/data:/app/Servidor/infraestructure/data:ro
    restart: unless-stopped

  tunel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:8080
    depends_on:
      - web
    restart: unless-stopped