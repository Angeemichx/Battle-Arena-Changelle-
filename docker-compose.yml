services:
  servidor:
    build:
      context: .
      dockerfile: Servidor/Dockerfile
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/usuarios.json
      HISTORIAL_FILE: /app/data/historial.json
    volumes:
      - ./Servidor/infraestructure/data:/app/data
    restart: unless-stopped